name: Sailo
description: Sailo is a global peer-to-peer boat rental and yacht charter marketplace,
  founded in 2014, that connects private boat owners and captains with renters across
  more than 3 continents, 50 countries, and 500 locations including New York, Miami,
  the Caribbean, Athens, and Phuket. The platform lists over 30,000 boats ranging from
  powerboats to luxury mega yachts for hourly, daily, and weekly charters with optional
  captain services, and provides verified listings, reviews, booking, and customer support
  to both sides of the transaction. Sailo is a Techstars-backed consumer marketplace and
  does not publish a public developer API, SDKs, or developer portal at this time.
